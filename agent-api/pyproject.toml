[project]
name = "agent-api"
version = "0.1.0"
description = "API FastAPI del agente RAG sobre documentos internos"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "langchain-core>=0.3", "pydantic>=2.7", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
